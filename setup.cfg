[metadata]
name = job-utils
version = 0.1.0
description = Cross-platform utilities for a Vim-centered GTD Markdown workflow

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    jobutils = jobutils.cli:main

[black]
line-length = 88
target-version = py38
