[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-utils"
version = "0.1.0"
description = "Cross-platform utilities for a Vim-centered GTD Markdown workflow"
requires-python = ">=3.8"

[project.scripts]
jobutils = "jobutils.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py38"]
